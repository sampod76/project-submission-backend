services:
  app:
    image: ghcr.io/sampod76/project-submission-backend:latest
    container_name: project-submission-backend
    profiles: ["app"]

    env_file:
      - ${PROJECT_SUBMISSION_ENV_FILE:?Set PROJECT_SUBMISSION_ENV_FILE to the new application env file}

    environment:
      HOST: 0.0.0.0
      PORT: 5000
      LOG_DIR: /app/logger
      LOG_LEVEL: info

    ports:
      - "5062:5000"

    volumes:
      - app_logs:/app/logger

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    restart: unless-stopped

    networks:
      - project-submission-backend-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  project-submission-backend-network:
    driver: bridge

volumes:
  app_logs:
