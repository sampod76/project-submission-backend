services:
  # https://app.notion.com/p/sampod/Migration-Docker-Container-4067a1bce8f580828fd1d5cbd3434ba4?source=copy_link
  migrate:
    image: ghcr.io/sampod76/project-submission-backend:latest
    command:
      [
        "npx",
        "--no-install",
        "prisma",
        "migrate",
        "deploy",
        "--config",
        "prisma.config.ts",
      ]
    env_file:
      - /home/sampod/apps/envs/project/server/.env.production
    restart: "no"
    networks:
      - project-submission-backend-network

  app:
    image: ghcr.io/sampod76/project-submission-backend:latest
    container_name: project-submission-backend
    depends_on:
      migrate:
        condition: service_completed_successfully

    env_file:
      - /home/sampod/apps/envs/project/server/.env.production

    environment:
      HOST: 0.0.0.0
      PORT: 5000
      LOG_DIR: /app/logger
      LOG_LEVEL: info

    ports:
      - "5062:5000"

    volumes:
      - app_logs:/app/logger

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    restart: unless-stopped

    networks:
      - project-submission-backend-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  project-submission-backend-network:
    driver: bridge

volumes:
  app_logs:
