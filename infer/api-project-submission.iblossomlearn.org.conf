map $http_upgrade $project_api_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name api-project-submission.iblossomlearn.org;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5062;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $project_api_connection_upgrade;

        proxy_connect_timeout 15s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;

        proxy_buffering off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
# sudo ln -s /etc/nginx/sites-available/api-project-submission.iblossomlearn.org /etc/nginx/sites-enabled/
    access_log /var/log/nginx/api-project-submission.access.log;
    error_log /var/log/nginx/api-project-submission.error.log;
}