services:
  migrate:
    image: project-submission-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "npx",
        "--no-install",
        "prisma",
        "migrate",
        "deploy",
        "--config",
        "prisma.config.ts",
      ]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/project_submission?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - project-submission-backend-network
  app:
    image: project-submission-backend:local
    build:
      context: .
      dockerfile: Dockerfile

    container_name: project-submission-backend-local

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/project_submission?schema=public
      HOST: 0.0.0.0
      PORT: 5000
      LOG_DIR: /app/logger
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    ports:
      - "5062:5000"

    volumes:
      - app_logs:/app/logger

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    restart: unless-stopped

    networks:
      - project-submission-backend-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  project-submission-backend-network:
    driver: bridge

volumes:
  app_logs:
  postgres_data:
